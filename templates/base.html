<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI 小说写作系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // 页面渲染前恢复侧栏折叠状态，避免闪烁
    try {
      if (localStorage.getItem('sidebar_collapsed') === '1') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <button id="sidebar-toggle" type="button" title="收起 / 展开导航" aria-label="收起 / 展开导航">☰</button>
  <div class="sidebar">
    <div class="logo">📖 AI 小说写作系统</div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">总览 Dashboard</a>

      <div class="nav-section">写作</div>
      <a href="{{ url_for('setup') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('setup') }}">🪄 新书向导</a>
      <a href="{{ url_for('chapter') }}" class="{{ 'active' if request.endpoint == 'chapter' }}">✍️ 写作工作台</a>
      <a href="{{ url_for('review') }}" class="{{ 'active' if request.endpoint == 'review' }}">审校循环</a>

      <div class="nav-section">记忆与设定</div>
      <a href="{{ url_for('characters') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('character') }}">角色列表</a>
      <a href="{{ url_for('outline') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('outline') }}">章节大纲</a>
      <a href="{{ url_for('memory') }}" class="{{ 'active' if request.endpoint == 'memory' }}">分层记忆</a>
      <a href="{{ url_for('bible') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('bible') }}">世界观设定库</a>
      <a href="{{ url_for('foreshadow') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('foreshadow') }}">伏笔追踪</a>
      <a href="{{ url_for('style') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('style') }}">文风控制</a>

      <div class="nav-section">系统</div>
      <a href="{{ url_for('settings_models') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('settings') }}">⚙️ 模型配置</a>
    </nav>
    <div class="sidebar-footer">本地原型 · JSON 落盘存储</div>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
  <script>
    (function () {
      var btn = document.getElementById('sidebar-toggle');
      btn.addEventListener('click', function () {
        var collapsed = document.documentElement.classList.toggle('sidebar-collapsed');
        try { localStorage.setItem('sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
      });
    })();
  </script>

  <!-- 全局悬浮 AI 聊天助手 -->
  <button id="chat-fab" type="button" title="AI 助手" aria-label="AI 助手">💬</button>
  <div id="chat-panel" class="chat-panel" hidden>
    <div class="chat-head">
      <span class="chat-title">🤖 AI 写作助手</span>
      <button id="chat-clear" type="button" class="chat-head-btn" title="清空会话">🗑 清空</button>
      <button id="chat-close" type="button" class="chat-head-btn" title="关闭">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" rows="2" placeholder="问点什么..."></textarea>
      <button id="chat-send" type="button" class="btn">发送</button>
    </div>
  </div>
  <script>
    (function () {
      var fab = document.getElementById('chat-fab');
      var panel = document.getElementById('chat-panel');
      var msgBox = document.getElementById('chat-messages');
      var input = document.getElementById('chat-input');
      var sendBtn = document.getElementById('chat-send');
      var loaded = false;
      var sending = false;

      function scrollBottom() { msgBox.scrollTop = msgBox.scrollHeight; }

      function addMsg(role, text) {
        var div = document.createElement('div');
        div.className = 'chat-msg ' + (role === 'user' ? 'from-user' : 'from-ai');
        div.textContent = text;
        msgBox.appendChild(div);
        scrollBottom();
        return div;
      }

      function loadHistory() {
        fetch("{{ url_for('assistant_history') }}").then(function (r) { return r.json(); }).then(function (d) {
          (d.messages || []).forEach(function (m) { addMsg(m.role, m.content); });
        }).catch(function () {});
      }

      fab.addEventListener('click', function () {
        panel.hidden = !panel.hidden;
        if (!panel.hidden && !loaded) { loaded = true; loadHistory(); }
        if (!panel.hidden) input.focus();
      });
      document.getElementById('chat-close').addEventListener('click', function () {
        panel.hidden = true;
      });
      document.getElementById('chat-clear').addEventListener('click', function () {
        if (!confirm('清空全部会话记录？')) return;
        fetch("{{ url_for('assistant_clear') }}", { method: 'POST' }).then(function () {
          msgBox.replaceChildren();
        });
      });

      function setSending(v) {
        sending = v;
        sendBtn.disabled = v;
        input.disabled = v;
      }

      function send() {
        var text = input.value.trim();
        if (!text || sending) return;
        setSending(true);
        addMsg('user', text);
        input.value = '';
        var bubble = addMsg('assistant', '思考中…');
        fetch("{{ url_for('assistant_chat') }}", {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ message: text }),
        }).then(function (resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          bubble.textContent = '';
          var reader = resp.body.getReader();
          var decoder = new TextDecoder('utf-8');
          function pump() {
            return reader.read().then(function (r) {
              if (r.done) return;
              bubble.textContent += decoder.decode(r.value, { stream: true });
              scrollBottom();
              return pump();
            });
          }
          return pump();
        }).catch(function (e) {
          bubble.textContent = '❌ 请求失败：' + e.message;
        }).finally(function () {
          setSending(false);
          input.focus();
        });
      }

      sendBtn.addEventListener('click', send);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
    })();
  </script>
</body>
</html>
